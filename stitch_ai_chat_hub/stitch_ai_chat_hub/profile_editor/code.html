<script>
        // Simple micro-interactions
        const menuBtn = document.querySelector('[data-icon="menu"]');
        const drawer = document.getElementById('nav-drawer');
        const overlay = document.getElementById('drawer-overlay');

        if (menuBtn) {
            menuBtn.parentElement.addEventListener('click', () => {
                drawer.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            });
        }

        overlay.addEventListener('click', () => {
            drawer.classList.add('-translate-x-full');
            overlay.classList.remove('opacity-100');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        });

        // Demo Field Deletion Logic
        document.querySelectorAll('[data-icon="delete"]').forEach(btn => {
            btn.parentElement.addEventListener('click', (e) => {
                const item = e.target.closest('.group');
                item.style.opacity = '0';
                item.style.transform = 'scale(0.9)';
                setTimeout(() => item.remove(), 300);
            });
        });

        // Hover responsiveness for touch
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.transform = 'scale(0.95)';
            });
            btn.addEventListener('touchend', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
